<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
const formats={currency:v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v),integer:v=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(v),decimal:v=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3}).format(v),percent:v=>nf.format(v)+'%',number:v=>nf.format(v),text:v=>String(v)};
const fmt=(v,k='number')=>v===null||v===undefined?'Não disponível':(formats[k]||formats.number)(v);
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function panel(title){const n=el('section','panel');n.append(el('h2','',title));return n}
function addCards(parent,cards){const wrap=el('div','cards');cards.forEach(c=>{const n=el('div','card');n.append(el('div','card-label',c.label),el('div','card-value',fmt(c.value,c.format)));if(c.detail)n.append(el('div','card-detail',c.detail));wrap.append(n)});parent.append(wrap)}
function svgEl(tag,attrs){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));return n}
function lineChart(c){const s=svgEl('svg',{viewBox:'0 0 680 260',role:'img','aria-label':c.title,class:'svgchart'});if(!c.values.length)return s;const max=Math.max(...c.values,1);const x=i=>60+(c.values.length===1?270:i*560/(c.values.length-1));const y=v=>210-v/max*175;for(let i=0;i<=4;i++){let v=max*i/4,yy=y(v);s.append(svgEl('line',{x1:60,x2:630,y1:yy,y2:yy,stroke:'#e1e8e9'}));const t=svgEl('text',{x:52,y:yy+4,'text-anchor':'end',fill:'#647583','font-size':11});t.textContent=nf.format(v);s.append(t)}s.append(svgEl('polyline',{points:c.values.map((v,i)=>x(i)+','+y(v)).join(' '),fill:'none',stroke:'#087c80','stroke-width':3}));c.values.forEach((v,i)=>{const circle=svgEl('circle',{cx:x(i),cy:y(v),r:4,fill:'#087c80'});const title=svgEl('title');title.textContent=c.labels[i]+': '+fmt(v,c.format);circle.append(title);s.append(circle);if(i===0||i===c.values.length-1||i%Math.max(1,Math.ceil(c.values.length/6))===0){const t=svgEl('text',{x:x(i),y:238,'text-anchor':'middle',fill:'#647583','font-size':11});t.textContent=c.labels[i];s.append(t)}});return s}
function addChart(parent,c){const n=panel(c.title);if(!c.values.length){n.append(el('p','note','Sem dados para este filtro.'));parent.append(n);return}if(c.kind==='line'){n.append(lineChart(c))}else{const max=c.format==='percent'?Math.max(100,...c.values.map(Math.abs)):Math.max(1,...c.values.map(Math.abs));const wrap=el('div','chartscroll');c.values.forEach((v,i)=>{const r=el('div','barrow');const track=el('div','track'),bar=el('div','bar'+(v<0?' negative':''));bar.style.width=(Math.abs(v)/max*100)+'%';track.append(bar);r.append(el('span','barlabel',c.labels[i]),track,el('span','barvalue',fmt(v,c.format)));wrap.append(r)});n.append(wrap,el('div','axisnote',c.format==='percent'?'Escala de 0 a 100%.':'Barras partem de zero; valores negativos aparecem em laranja.'))}if(c.note)n.append(el('p','note',c.note));parent.append(n)}
function addTable(parent,t){const n=panel(t.title);const search=el('input','search');search.type='search';search.placeholder='Pesquisar nesta tabela';search.setAttribute('aria-label','Pesquisar '+t.title);const wrap=el('div','table-wrap'),tab=el('table'),head=el('thead'),tr=el('tr'),body=el('tbody');t.columns.forEach(c=>tr.append(el('th','',c)));head.append(tr);tab.append(head,body);const caption=el('p','note');function draw(){body.replaceChildren();const term=search.value.toLocaleLowerCase('pt-BR');const rows=t.rows.filter(r=>r.join(' ').toLocaleLowerCase('pt-BR').includes(term));rows.forEach(row=>{const tr=el('tr');row.forEach(v=>tr.append(el('td','',v===null||v===undefined?'Não disponível':typeof v==='number'?new Intl.NumberFormat('pt-BR',{maximumFractionDigits:4}).format(v):String(v))));body.append(tr)});caption.textContent=rows.length+' de '+t.rows.length+' linhas'}search.addEventListener('input',draw);draw();wrap.append(tab);n.append(search,wrap,caption);parent.append(n)}
function addMatrix(parent,m){const n=panel('Matriz de confusão • teste temporal');const root=el('div','matrix'),g=el('div','matrixgrid');['Real ↓ / Prevista →','No prazo','Atraso','No prazo',m[0][0],m[0][1],'Atraso',m[1][0],m[1][1]].forEach((v,i)=>g.append(el('div',i===4||i===8?'cell good':i===5||i===7?'cell':'',v)));root.append(g,el('p','matrix-axis','Diagonal: previsões corretas. Fora da diagonal: erros.'));n.append(root);parent.append(n)}
function olistView(parent,p){if(!p.olist_groups)return;const root=el('section','full'),bar=el('div','filterbar');const months=[...new Set(p.olist_groups.map(g=>g.month))].sort(),states=[...new Set(p.olist_groups.map(g=>g.state))].sort();function select(label,options){const l=el('label','',label),s=el('select');s.append(el('option','','Todos'));s.options[0].value='';options.forEach(v=>{const o=el('option','',v);o.value=v;s.append(o)});l.append(s);bar.append(l);return s}const month=select('Mês da compra',months),state=select('UF do cliente',states),dynamic=el('div');root.append(bar,dynamic);parent.append(root);function render(){dynamic.replaceChildren();const gs=p.olist_groups.filter(g=>(!month.value||g.month===month.value)&&(!state.value||g.state===state.value));const sum=k=>gs.reduce((a,g)=>a+g[k],0),count=sum('orders');addCards(dynamic,[{label:'Pedidos entregues analisados',value:count,format:'integer'},{label:'Taxa de atraso',value:count?sum('late')/count*100:null,format:'percent'},{label:'Valor dos produtos',value:p.olist_has_prices?sum('revenue')/100:null,format:'currency',detail:'Sem frete; somente itens com preço válido'},{label:'Tempo médio de entrega',value:count?sum('days')/count:null,format:'decimal',detail:'Dias corridos, incluindo frações de dia'}]);const grid=el('div','grid');dynamic.append(grid);const monthly={};gs.forEach(g=>{monthly[g.month]??={orders:0,late:0};monthly[g.month].orders+=g.orders;monthly[g.month].late+=g.late});const labels=Object.keys(monthly).sort();addChart(grid,{title:'Pedidos por mês da compra',labels,values:labels.map(k=>monthly[k].orders),format:'integer',kind:'line'});addChart(grid,{title:'Entregas no prazo e em atraso',labels:['No prazo','Atrasadas'],values:[count-sum('late'),sum('late')],format:'integer'});const rows=labels.map(k=>[k,monthly[k].orders,monthly[k].late,monthly[k].late/monthly[k].orders*100]);addTable(dynamic,{title:'Resumo do filtro atual',columns:['Mês','Pedidos','Atrasados','Taxa de atraso (%)'],rows});dynamic.append(el('p','note','Estes filtros alteram somente a visão exploratória. As métricas do modelo e as imagens exportadas abaixo mantêm a população original.'))}month.addEventListener('change',render);state.addEventListener('change',render);render()}
function show(key){const p=DATA.pages.find(p=>p.id===key)||DATA.pages[0];history.replaceState(null,'','#'+p.id);document.querySelectorAll('nav button').forEach(b=>{const active=b.dataset.id===p.id;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});$('title').textContent=p.title;$('subtitle').textContent=p.subtitle;$('status').replaceChildren(el('span','pill'+(p.status==='ok'?'':' warn'),p.status==='ok'?'Resultados carregados':p.status==='missing'?'Resultados não encontrados':'Revisar arquivo de origem'),el('span','', 'Fotografia gerada em '+new Date(DATA.generated).toLocaleString('pt-BR')));const content=$('content');content.replaceChildren();if(p.status!=='ok'){const n=el('div','empty');n.append(el('h2','','Vamos localizar os resultados'),el('p','source-path',p.folder));p.notes.forEach(t=>n.append(el('p','',t)));content.append(n)}else{if(p.cards.length)addCards(content,p.cards);olistView(content,p);const grid=el('div','grid');if(p.matrix)addMatrix(grid,p.matrix);p.charts.forEach(c=>addChart(grid,c));if(grid.childNodes.length)content.append(grid);p.tables.forEach(t=>{const n=el('div','grid');const full=el('div','full');addTable(full,t);n.append(full);content.append(n)});if(p.images.length){const gallery=el('div','grid gallery');p.images.forEach(img=>{const n=panel(img.title),figure=el('figure'),image=el('img');image.src=img.data;image.alt=img.title;image.loading='lazy';figure.append(image,el('figcaption','','Figura exportada pelo notebook.'));n.append(figure);gallery.append(n)});content.append(gallery)}const notes=panel('Como interpretar');const ul=el('ul','notes');p.notes.forEach(note=>ul.append(el('li','',note)));notes.append(ul);content.append(notes)}const s=el('details','panel sources');s.append(el('summary','','Fontes e rastreabilidade'));s.append(el('p','source-path','Pasta lida: '+p.folder));p.sources.forEach(src=>{const d=el('div','');d.append(el('strong','',src.arquivo),el('p','','Modificado: '+new Date(src.modificado).toLocaleString('pt-BR')),el('code','','SHA-256: '+src.sha256));s.append(d)});s.style.marginTop='20px';content.append(s);$('footer').textContent='Relatório local · Abra os detalhes de fontes para conferir a origem. Para atualizar, execute painel.py novamente.'}
DATA.pages.forEach(p=>{const b=el('button');b.dataset.id=p.id;b.append(el('span','navnum',p.id==='olist'?'05':'0'+p.id),el('span','',p.id==='olist'?'Olist · Vendas':p.title));b.addEventListener('click',()=>show(p.id));$('nav').append(b)});if(DATA.demo)document.body.classList.add('demo');show(location.hash.slice(1));
</script></body></html>
